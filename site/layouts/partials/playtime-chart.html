<div class="card p-3"><svg class="playtime-chart" viewBox="0 0 1000 380" role="group" aria-labelledby="chart-title-{{ time_mode }} chart-desc-{{ time_mode }}"><title id="chart-title-{{ time_mode }}">{{ translate("ui.daily_playtime") }}</title><desc id="chart-desc-{{ time_mode }}">{{ translate("ui.x_axis_days_y_axis_hours_exact_values_are_listed_in_the_table_below") }}</desc><text x="8" y="18">{{ translate("ui.hours") }}</text>
{% for item2 in p['ticks'] %}<line x1="65" x2="980" y1="{{ item2['y'] }}" y2="{{ item2['y'] }}" stroke="#dce3e7"/><text x="10" y="{{ item2['y'] }}">{{ item2['hours'] }}</text>{% endfor %}
{% for item3 in p['days'] %}<a href="{{ ctx['root'] }}maps/index.html#day-{{ item3['date'] }}" tabindex="0" aria-label="{{ translate('ui.calendar_day', day=item3['date']) }} · {{ item3['duration'] }}"><rect x="{{ item3['x'] }}" y="{{ item3['y'] if item3['seconds'] else 318 }}" width="{{ item3['width'] }}" height="{{ item3['height'] if item3['seconds'] else 2 }}" rx="2" fill="#287f91" class="{{ 'playtime-zero' if not item3['seconds'] else '' }}"><title>{{ item3['date'] }} · {{ item3['duration'] }}</title></rect></a>{% if item3['tick'] %}<text x="{{ item3['x'] }}" y="348" class="chart-date">{{ item3['label'] }}</text>{% endif %}{% endfor %}<text x="935" y="375">{{ translate("ui.days") }}</text></svg></div>
